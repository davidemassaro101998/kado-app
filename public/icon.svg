<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512">
  <!-- Same glyph as GiftBadge3D.tsx (src/components/GiftBadge3D.tsx) so
       the generated app icon (favicon, home screen icon, OG preview)
       matches the in-app logo exactly instead of drifting apart —
       previously this file kept the old navy/gold realistic gift box
       design even after the in-app logo moved to the flat coral badge
       shared with Bricolo/Forma, so the icon on a user's home screen
       looked like a different app from the one that opened. -->
  <defs>
    <linearGradient id="giftIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="100%" stop-color="#E63354" />
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="100" height="100" rx="26" fill="url(#giftIconBg)" />
  <g stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="7" fill="none">
    <rect x="28" y="52" width="64" height="42" rx="6" />
    <rect x="22" y="38" width="76" height="16" rx="5" />
    <line x1="60" y1="38" x2="60" y2="94" />
    <path d="M 60 38 C 48 24, 34 30, 52 38" />
    <path d="M 60 38 C 72 24, 86 30, 68 38" />
  </g>
</svg>

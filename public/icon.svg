<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C4E6F" />
      <stop offset="50%" stop-color="#24425F" />
      <stop offset="100%" stop-color="#1C354E" />
    </linearGradient>

    <!-- Gold Ribbon Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="40%" stop-color="#DFB960" />
      <stop offset="100%" stop-color="#9E7A26" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- iOS Style Rounded App Icon Canvas -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Gold Accent Border -->
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6" />

  <!-- Gift Box Body -->
  <g filter="url(#shadow)" transform="translate(256, 276)">
    <!-- Main Box Container -->
    <rect x="-120" y="-80" width="240" height="190" rx="24" fill="#24425F" stroke="#DFB960" stroke-width="3" />
    <rect x="-130" y="-110" width="260" height="45" rx="14" fill="#2C4E6F" stroke="#DFB960" stroke-width="3" />

    <!-- Vertical Gold Ribbon -->
    <rect x="-24" y="-110" width="48" height="220" fill="url(#goldGrad)" />

    <!-- Horizontal Gold Ribbon Lid -->
    <rect x="-130" y="-95" width="260" height="24" fill="url(#goldGrad)" opacity="0.9" />

    <!-- 3D Ribbon Bow Top Loops -->
    <path d="M 0,-110 C -45,-165 -95,-165 -65,-120 C -45,-90 0,-110 0,-110 Z" fill="url(#goldGrad)" />
    <path d="M 0,-110 C 45,-165 95,-165 65,-120 C 45,-90 0,-110 0,-110 Z" fill="url(#goldGrad)" />
    
    <!-- Bow Knot -->
    <circle cx="0" cy="-110" r="18" fill="#FFE8A3" stroke="#9E7A26" stroke-width="2" />
  </g>
</svg>
